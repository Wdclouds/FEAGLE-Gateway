name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux-suite:
    name: Build Linux Suite Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Building Linux suite for version: ${VERSION}"

      - name: Package Linux Suite
        run: |
          chmod +x scripts/package-release.sh
          ./scripts/package-release.sh "${{ steps.get_version.outputs.VERSION }}"

      - name: Upload Linux Suite Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-suite
          path: dist/feagle-suite-linux-amd64-v${{ steps.get_version.outputs.VERSION }}.tar.gz

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-suite]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract Tag Version
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: linux-suite
          path: dist-release/

      - name: List Artifacts to Publish
        run: ls -la dist-release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "FEAGLE Gateway v${{ steps.get_version.outputs.VERSION }}"
          draft: false
          prerelease: false
          files: |
            dist-release/*
          generate_release_notes: true
