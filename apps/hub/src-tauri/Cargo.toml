[package]
name = "feagle-hub-app"
version = "0.1.0"
description = "FEAGLE Hub Desktop Application"
authors = ["Haiying Kou <Wdclouds>"]
license = "MIT"
repository = "https://github.com/Wdclouds/FEAGLE-Hub"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1" }
tauri-plugin-log = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "z"
strip = true
