services:
  # ============================================================================
  # 1. FEAGLE WeChat Bridge (协议中继与 Web 控制台 :6190/:6191/:6192/:6199)
  # ============================================================================
  bridge:
    build:
      context: .
      dockerfile: apps/bridge/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-alpine}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
    container_name: feagle-bridge
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1}
      NODE_ENV: production
      GATEWAY_INBOUND_URL: http://gateway:6185/inbound
    volumes:
      - ./data:/app/data
      - ./apps/plugins:/app/apps/plugins:ro
    ports:
      - "${DASHBOARD_HOST_PORT:-6190}:6190"
      - "${ANDROID_WS_BIND_HOST:-0.0.0.0}:${ANDROID_WS_HOST_PORT:-6191}:${ANDROID_WS_PORT:-6191}"
    networks:
      - feagle_net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:6190/api/health/live >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 30s

  # ============================================================================
  # 2. FEAGLE Four-Layer Funnel Gateway (Profile: gateway)
  # ============================================================================
  gateway:
    image: ${NODE_IMAGE:-node:22-alpine}
    container_name: feagle-gateway
    restart: unless-stopped
    profiles:
      - gateway
    working_dir: /app
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      NODE_ENV: production
      BRIDGE_OUT_URL: http://bridge:6192/gw/outbound
      MNEMOSYNE_BASE_URL: ${MNEMOSYNE_BASE_URL:-http://host.docker.internal:18010}
    volumes:
      - .:/app
    command: ["sh", "-c", "npm run build:gateway && npm run start:gateway"]
    ports:
      - "127.0.0.1:6185:6185"
    networks:
      - feagle_net
    stop_grace_period: 20s

  # ============================================================================
  # 3. Mnemosyne 向量记忆数据库 (Profile: hermes)
  # ============================================================================
  mnemosyne-db:
    image: pgvector/pgvector:pg16
    container_name: feagle-mnemosyne-db
    restart: unless-stopped
    profiles:
      - hermes
    environment:
      POSTGRES_USER: ${MNEMOSYNE_DB_USER:-hermes}
      POSTGRES_PASSWORD: ${MNEMOSYNE_DB_PASSWORD:-replace_with_db_password}
      POSTGRES_DB: ${MNEMOSYNE_DB_NAME:-mnemosyne}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/mnemosyne-db:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - feagle_net
    deploy:
      resources:
        limits:
          memory: 250M

  # ============================================================================
  # 4. 可选 AstrBot 插件生态容器 (Profile: astrbot)
  # ============================================================================
  astrbot:
    image: soulter/astrbot:latest
    container_name: feagle-astrbot
    restart: unless-stopped
    profiles:
      - astrbot
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./data/astrbot:/AstrBot/data
    ports:
      - "${ASTRBOT_WEBUI_HOST_PORT:-6186}:6185"
      - "127.0.0.1:6199:6199"
    networks:
      - feagle_net
    stop_grace_period: 15s

networks:
  feagle_net:
    name: feagle_network
    driver: bridge
